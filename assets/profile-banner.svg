<svg xmlns="http://www.w3.org/2000/svg"
 xmlns:xlink="http://www.w3.org/1999/xlink"
 width="1983" height="579" viewBox="0 0 1983 579">

 <defs>
   <linearGradient id="edge" gradientUnits="userSpaceOnUse"
                   x1="-240" y1="0" x2="240" y2="0">
     <!-- black = no dark overlay (bright source revealed);
          white = dark overlay retained -->
     <stop offset="0" stop-color="black"/>
     <stop offset="0.20" stop-color="black"/>
     <stop offset="0.50" stop-color="#808080"/>
     <stop offset="0.80" stop-color="white"/>
     <stop offset="1" stop-color="white"/>
     <animateTransform attributeName="gradientTransform"
                       type="translate"
                       from="-300 0" to="2283 0"
                       begin="0s" dur="3.2s"
                       calcMode="spline"
                       keyTimes="0;1"
                       keySplines="0.37 0 0.63 1"
                       fill="freeze"/>
   </linearGradient>

   <mask id="sweep" maskUnits="userSpaceOnUse"
         x="0" y="0" width="1983" height="579">
     <!-- This rectangle is white by default, so the entire banner starts dark.
          The moving gradient progressively turns the area behind it black. -->
     <rect x="0" y="0" width="1983" height="579" fill="url(#edge)"/>
   </mask>
 </defs>

 <image x="0" y="0" width="1983" height="579"
        preserveAspectRatio="none"
        href="./profile-banner.png"/>

 <!-- Uniform darkness at t=0. The mask removes it smoothly from left to right. -->
 <rect x="0" y="0" width="1983" height="579"
       fill="black" opacity="0.78" mask="url(#sweep)"/>
</svg>
